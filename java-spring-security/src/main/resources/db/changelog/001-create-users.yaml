databaseChangeLog:

  - changeSet:
      id: 1-create-user-table
      author: navin
      changes:
        - createTable:
            tableName: USERS
            columns:
              - column:
                  name: id
                  type: BIGINT AUTO_INCREMENT
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-create-authorities-table
      author: navin
      changes:
        - createTable:
            tableName: AUTHORITIES
            columns:
              - column:
                  name: id
                  type: BIGINT AUTO_INCREMENT
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: authority
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              # ⭐ Foreign key column required by @ManyToOne
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: AUTHORITIES
            baseColumnNames: user_id
            referencedTableName: USERS
            referencedColumnNames: id
            constraintName: fk_authorities_user