<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<title>Login</title>
<link rel="stylesheet"
	th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" />
</head>

<body>
	<section class="py-3 py-md-5 py-xl-8">
	  <div class="container">
	    <div class="row justify-content-center">
	      <div class="col-12 col-lg-10 col-xl-8">
	        <div class="row gy-5 justify-content-center">
	          <div class="col-12 col-lg-5">
	            <form method="post">
	              <div class="row gy-3 overflow-hidden">
	                <div class="col-12">
	                  <div class="form-floating mb-3">
	                    <input type="text" id="name" name="name" class="form-control border-0 border-bottom rounded-0" placeholder="Name" required>
	                    <label for="email" class="form-label">Name</label>
	                  </div>
	                </div>
	                <div class="col-12">
	                  <div class="form-floating mb-3">
	                    <input type="password" class="form-control border-0 border-bottom rounded-0" name="password" id="password" value="" placeholder="Password" required>
	                    <label for="password" class="form-label">Password</label>
	                  </div>
	                </div>
	                <div class="col-12">
	                  <div class="row justify-content-between">
	                    <div class="col-6">
	                      <div class="form-check">
	                        <input class="form-check-input" type="checkbox" value="" name="remember_me" id="remember_me">
	                        <label class="form-check-label text-secondary" for="remember_me">
	                          Remember me
	                        </label>
	                      </div>
	                    </div>
	                    <div class="col-6">
	                      <div class="text-end">
	                        <a href="#!" class="link-secondary text-decoration-none">Forgot password?</a>
	                      </div>
	                    </div>
	                  </div>
	                </div>
	                <div class="col-12">
	                  <div class="d-grid">
	                    <button class="btn btn-primary btn-lg" type="submit">Log in</button>
	                  </div>
	                </div>
	              </div>
	            </form>
	          </div>
	        </div>
	      </div>
	     </div>
	    </div>
	  </section>
</body>

</html>
